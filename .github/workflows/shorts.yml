
name: F-Tech Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only; do not upload to YouTube"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: ftech-shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -c "import os; assert os.getenv('GEMINI_API_KEY'), 'GEMINI_API_KEY missing'; assert os.getenv('PIXABAY_API_KEY'), 'PIXABAY_API_KEY missing'; print('Required secrets are present.')"

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          TTS_VOICE: id-ID-ArdiNeural
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: python app.py

      - name: Save history to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update F-Tech anti-duplication history"
            git push
          else
            echo "No history changes to commit."
          fi

      - name: Upload generated video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftech-shorts-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
